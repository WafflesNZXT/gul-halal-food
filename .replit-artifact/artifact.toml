kind = "web"
previewPath = "/"
title = "Gul Halal Food"
version = "1.0.0"
id = "artifacts/gul-halal-food"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24932

[services.development]
run = "pnpm --filter @workspace/gul-halal-food run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gul-halal-food", "run", "build" ]
serve = "static"
publicDir = "artifacts/gul-halal-food/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24932"
BASE_PATH = "/"
